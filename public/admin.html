<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Cybot 420 Panel</title>
<style>
  :root{--bg:#0b1020;--panel:#121a33;--panel2:#182246;--accent:#36e2a3;--text:#eef2ff;--sub:#9aa5c7;--danger:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  h1{font-size:18px;text-align:center}
  input{width:100%;padding:10px;border-radius:8px;border:1px solid #263163;background:var(--panel2);color:var(--text);margin-bottom:10px}
  button{padding:8px 12px;border:none;border-radius:8px;background:var(--accent);color:#06251a;font-weight:700;font-size:12px;cursor:pointer}
  button.danger{background:var(--danger);color:#2a0a0a}
  .card{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #263163}
  .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .num{font-weight:700;font-size:14px}
  .tag{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700}
  .tag.active{background:#0f3d2a;color:var(--accent)}
  .tag.expired{background:#3d1414;color:var(--danger)}
  .tag.free{background:#3a3417;color:#ffd166}
  .tag.pending{background:#182246;color:var(--sub)}
  .meta{font-size:12px;color:var(--sub);width:100%}
  .btns{display:flex;gap:8px;margin-top:8px}
  #login{max-width:300px;margin:60px auto}
</style>
</head>
<body>
<div id="login">
  <p style="text-align:center"><a href="/" style="color:#36e2a3">→ Go to Deploy Page</a></p>
  <h1>🔒 Admin Login</h1>
  <input id="pw" type="password" placeholder="Admin password">
  <button style="width:100%" onclick="login()">Enter</button>
</div>

<div id="dashboard" style="display:none;max-width:500px;margin:0 auto">
  <h1>📊 Deployed Bots</h1>
  <div id="list"></div>
</div>

<script>
let password = '';

function login(){
  password = document.getElementById('pw').value;
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  load();
  setInterval(load, 8000);
}

async function load(){
  const r = await fetch('/api/admin/users?password='+encodeURIComponent(password));
  if(r.status === 401){ alert('Wrong password'); location.reload(); return; }
  const users = await r.json();
  const el = document.getElementById('list');
  if(users.length === 0){ el.innerHTML = '<div class="meta">No users yet.</div>'; return; }
  el.innerHTML = users.map(u => {
    const tagClass = u.free ? 'free' : (u.subStatus==='active' ? 'active' : ((u.subStatus==='pending' || u.subStatus==='pending_manual') ? 'pending' : 'expired'));
    const tagText = u.free ? 'FREE FRIEND' : (u.subStatus==='pending_manual' ? 'PAYMENT CLAIMED — CHECK M-PESA' : u.subStatus.toUpperCase());
    return `<div class="card">
      <div class="row">
        <span class="num">${u.number}</span>
        <span class="tag ${tagClass}">${tagText}</span>
      </div>
      <div class="meta">Bot: ${u.botStatus} · Days left: ${u.daysLeft}</div>
      <div class="btns">
        <button onclick="extend('${u.number}')">+30 days</button>
        <button class="danger" onclick="deactivate('${u.number}')">Deactivate</button>
  </div>
async function extend(number){
  await fetch('/api/admin/extend', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password, number, days: 30 })
  });
  load();
}

async function deactivate(number){
  if(!confirm('Deactivate '+number+'\'s bot now?')) return;
  await fetch('/api/admin/deactivate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password, number })
  });
  load();
}
</script>
</body>
</html>
